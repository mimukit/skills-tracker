# Daily drift check: fetch each tracked upstream, compare to the committed
# snapshot, and open/update one canonical "skills-watcher" issue when something
# drifted. The issue is the signal — the job itself stays green.
name: skills-watcher

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # brings in watch.json + committed snapshots/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check upstream drift
        run: npx --yes skills-watcher check --issue || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
